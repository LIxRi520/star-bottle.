        star.style.width = s + 'px';
        star.style.height = s + 'px';
        container.appendChild(star);
      }
    }

    /* ===== Random Color Helpers ===== */
    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }
    function randomColor(baseHue, hueVar, satMin, satMax, lightMin, lightMax) {
      var h = baseHue + randomInt(-hueVar, hueVar);
      var s = randomInt(satMin, satMax);
      var l = randomInt(lightMin, lightMax);
      return 'hsl(' + h + ',' + s + '%,' + l + '%)';
    }
    // 全随机色相，与情绪无关；传 seed 则基于种子稳定（旧数据迁移用）
    function generateStarColors(seed) {
      var h, s, l;
      if (seed !== undefined) {
        h = Math.floor(seededRandom(seed) * 360);
        s = 72 + Math.floor(seededRandom(seed + 1) * 23);
        l = 45 + Math.floor(seededRandom(seed + 2) * 15);
      } else {
        h = randomInt(0, 359);
        s = randomInt(72, 95);
        l = randomInt(45, 60);
      }
      function hsl(dl, ds) {
        var ll = Math.max(6, Math.min(92, l + dl));
        var ss = Math.max(20, Math.min(100, s + (ds || 0)));
        return 'hsl(' + h + ',' + ss + '%,' + ll + '%)';
      }
      return {
        top:   hsl(18, -6),   // 中心凸起面 - 最亮
        light: hsl(9,  -3),   // 受光三角面
        base:  hsl(0),        // 底色
        dark:  hsl(-14, 2),   // 背光三角面
        edge:  hsl(-26, 6)    // 边缘轮廓 - 最深
      };
    }

    /* ===== 3D Origami Star Facets ===== */
    // 纸折幸运星的几何面片：中心凸起五边形 + 5 个亮瓣 + 5 个暗瓣 + 折痕/脊线
    function buildStarFaces(c) {
      var tips   = ['50,8','89.9,37.1','74.7,83.9','25.3,83.9','10.1,37.1'];   // 外尖角
      var notchs = ['61.8,33.8','69.0,56.2','50,70','31.0,56.2','38.2,33.8'];  // 凹点
      var inner  = ['50,30.5','65.96,42.14','59.88,60.86','40.12,60.86','34.04,42.14']; // 中心五边形顶点
      var h = '';
      // 1. 兜底轮廓（防止面片之间露缝）
      h += '<path d="M 50,8 L 61.8,33.8 L 89.9,37.1 L 69.0,56.2 L 74.7,83.9 L 50,70 L 25.3,83.9 L 31.0,56.2 L 10.1,37.1 L 38.2,33.8 Z" '
         + 'fill="' + c.base + '" stroke="' + c.edge + '" stroke-width="1.6" stroke-linejoin="round"/>';
      // 2. 五个瓣：每个由亮面(内顶点→尖角→左凹点) + 暗面(尖角→右凹点→内顶点) 组成
      for (var i = 0; i < 5; i++) {
        var prev = (i + 4) % 5;
        h += '<polygon points="' + inner[i] + ' ' + tips[i] + ' ' + notchs[prev] + '" fill="' + c.light + '"/>';
        h += '<polygon points="' + tips[i] + ' ' + notchs[i] + ' ' + inner[i] + '" fill="' + c.dark + '"/>';
      }
      // 3. 中心凸起五边形（顶面，最亮）
      h += '<polygon points="' + inner.join(' ') + '" fill="' + c.top + '"/>';
      // 4. 折痕：中心五边形边缘 - 暗线
      h += '<polygon points="' + inner.join(' ') + '" fill="none" stroke="rgba(0,0,0,0.22)" stroke-width="1" stroke-linejoin="round"/>';
      // 5. 脊线：内顶点→外尖角，白色高光折线
      h += '<path d="M 50,30.5 L 50,8 M 65.96,42.14 L 89.9,37.1 M 59.88,60.86 L 74.7,83.9 M 40.12,60.86 L 25.3,83.9 M 34.04,42.14 L 10.1,37.1" '
         + 'stroke="rgba(255,255,255,0.28)" stroke-width="1" fill="none"/>';
      // 6. 顶部小光晕（内缩五边形，增加球面凸起感）
      h += '<polygon points="50,39.5 56.38,44.16 53.95,51.64 46.05,51.64 43.62,44.16" fill="rgba(255,255,255,0.20)"/>';
      return h;
    }

    /* ===== 2D Physics Engine for Bottle Stars =====
       星星受重力下落、互相碰撞、堆叠在瓶底，不再钉在固定位置 */
    var activeStars = [];      // 正在物理模拟的星星
    var pendingStars = [];     // 等待从瓶口掉落的星星
    var physRunning = false;
    var physRaf = null;
    var physLast = 0;
    var releaseAccum = 0;

    // 瓶子内壁几何（SVG viewBox 240x260 坐标系）
    var BOTTLE = {
      left: 52, right: 188,    // 瓶身内壁 x 范围
      mouthY: 58,              // 瓶口上界（防止星星堆出瓶外）
      bottomY: function(x) {   // 底部弧线（抛物线近似）
        var t = (x - 120) / 70;
        return 212 - 37 * t * t;
      }
    };
    var PHYS = { gravity: 620, restitution: 0.4, friction: 0.88, drag: 0.992 };

    function seededRandom(seed) {
      var x = Math.sin(seed) * 10000;
      return x - Math.floor(x);
    }

    // 星星尺寸随总数自适应：少时大颗清晰，多时变小以全部真实堆进瓶肚
    function starSizeForTotal(total) {
      if (total <= 30) return { min: 17, max: 27 };
      if (total <= 60) return { min: 14, max: 22 };
      if (total <= 100) return { min: 11, max: 17 };
      return { min: 9, max: 13 };
    }

    function makeStarData(idx, entering) {
      var seedBase = (letters[idx] && letters[idx].id) || (idx * 7919);
      var sr = function(offset) { return seededRandom(seedBase + offset); };
      var sz = starSizeForTotal(letters.length);
      var baseSize = sz.min + sr(4) * (sz.max - sz.min);
      return {
        x: entering ? (108 + Math.random() * 24) : (108 + sr(1) * 24),
        y: entering ? 12 : 12,
        vx: entering ? (Math.random() - 0.5) * 60 : (sr(7) - 0.5) * 60,
        vy: 0,
        r: baseSize / 2,
        rot: sr(3) * 360,
        rotV: (sr(8) - 0.5) * 150,
        scale: baseSize / 100,
        colors: (letters[idx] && letters[idx].starColors) || generateStarColors(seedBase),
        el: null
      };
    }

    function buildStarDom(data, idx) {
      var container = document.getElementById('bottleStars');
      var g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('class', 'phys-star');
      var inner = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      inner.setAttribute('class', 'star-inner');
      var d = Math.abs(Math.sin(idx * 2.7));
      var dur = 3.2 + Math.abs(Math.cos(idx * 1.7)) * 2.5;
      inner.setAttribute('style', 'animation-delay:' + (d * -4) + 's;animation-duration:' + dur + 's');
      inner.innerHTML = '<path d="M 50,10 L 61.8,35.8 L 89.9,39.1 L 69.0,58.2 L 74.7,85.9 L 50,72 L 25.3,85.9 L 31.0,58.2 L 10.1,39.1 L 38.2,35.8 Z" '
        + 'fill="rgba(0,0,0,0.22)" transform="translate(1.5,2.5)"/>'
        + buildStarFaces(data.colors);
      g.appendChild(inner);
      container.appendChild(g);
      data.el = g;
    }

    // 边界约束：瓶壁 / 瓶颈漏斗 / 底部弧 / 瓶口上界
    // 在积分后和碰撞迭代后都要调用，防止星星被推挤出瓶壁
    function applyBounds(s, dt, REST, FRIC, G) {
      var r = s.r;
      // 瓶颈 & 瓶肩漏斗约束（y<66 区域）
      if (s.y < 66) {
        var xl, xr;
        if (s.y < 38) { xl = 98; xr = 142; }
        else if (s.y < 64) { var k = (s.y - 38) / 26; xl = 98 - 48 * k; xr = 142 + 48 * k; }
        else { xl = 50; xr = 190; }
        if (s.x < xl + r) { s.x = xl + r; if (s.vx < 0) s.vx = -s.vx * REST; }
        if (s.x > xr - r) { s.x = xr - r; if (s.vx > 0) s.vx = -s.vx * REST; }
      }
      // 左右瓶壁
      if (s.x < BOTTLE.left + r) { s.x = BOTTLE.left + r; if (s.vx < 0) s.vx = -s.vx * REST; }
      if (s.x > BOTTLE.right - r) { s.x = BOTTLE.right - r; if (s.vx > 0) s.vx = -s.vx * REST; }
      // 底部弧壁
      var by = BOTTLE.bottomY(s.x);
      if (s.y + r > by) {
        s.y = by - r;
        // 强冲击才反弹，低速直接吸附（避免重力每帧累积造成的微振荡）
        if (s.vy > 12) { s.vy = -s.vy * REST; s.rotV += (Math.random() - 0.5) * 60; }
        else { s.vy = 0; s.vx *= 0.85; }   // 吸附 + 抓地
        s.vx *= FRIC;
        // 弧面切向重力：让星星自然滑向瓶底中央（静止时无力，不会永动）
        var slope = -74 * (s.x - 120) / 4900;
        var tang = slope / Math.sqrt(1 + slope * slope);
        s.vx += G * tang * dt * 0.2;
      }
      // 瓶口上界（防止堆出瓶外）
      if (s.y - r < BOTTLE.mouthY) { s.y = BOTTLE.mouthY + r; if (s.vy < 0) s.vy = 0; }
    }

    function physicsStep(dt) {
      // 每帧以约 45 颗/秒 的速率把待掉落的星星送入瓶口（"倒星星"效果）
      releaseAccum += dt * 45;
      var cnt = Math.floor(releaseAccum);
      releaseAccum -= cnt;
      while (cnt-- > 0 && pendingStars.length) {
        var ps = pendingStars.shift();
        activeStars.push(ps);
        buildStarDom(ps, activeStars.length - 1);
      }

      var n = activeStars.length;
      if (!n) return;
      var G = PHYS.gravity, REST = PHYS.restitution, FRIC = PHYS.friction;
      var dragF = Math.pow(PHYS.drag, dt * 60);
      var i, j;

      // 1) 积分：重力、阻力、位移、旋转
      for (i = 0; i < n; i++) {
        var s = activeStars[i];
        s.vy += G * dt;
        s.vx *= dragF; s.vy *= dragF;
        s.x += s.vx * dt;
        s.y += s.vy * dt;
        s.rot += s.rotV * dt;
        s.rotV *= Math.pow(0.985, dt * 60);
        applyBounds(s, dt, REST, FRIC, G);
      }

      // 2) 星星间碰撞：位置分离 + 弹性速度交换（3 次迭代保证稳定堆叠）
      for (var iter = 0; iter < 3; iter++) {
        for (i = 0; i < n; i++) {
          var a = activeStars[i];
          for (j = i + 1; j < n; j++) {
            var b = activeStars[j];
            var dx = b.x - a.x, dy = b.y - a.y;
            var minD = a.r + b.r;
            var d2 = dx * dx + dy * dy;
            if (d2 >= minD * minD || d2 < 0.0001) continue;
            var d = Math.sqrt(d2);
            var nx = dx / d, ny = dy / d;
            var overlap = minD - d;
            var wa = b.r / (a.r + b.r), wb = a.r / (a.r + b.r);
            a.x -= nx * overlap * wa; a.y -= ny * overlap * wa;
            b.x += nx * overlap * wb; b.y += ny * overlap * wb;
            var na = a.vx * nx + a.vy * ny, nb = b.vx * nx + b.vy * ny;
            var relV = na - nb;
            if (relV > 0) {
              if (relV < 20) {
                // 静置接触：两星法向速度绝对清零（整堆逐层静止，不随重力累积）
                a.vx -= na * nx; a.vy -= na * ny;
                b.vx -= nb * nx; b.vy -= nb * ny;
              } else {
                // 高速冲击：弹性反弹
                var imp = (1 + REST) * relV * 0.5;
                a.vx -= imp * nx; a.vy -= imp * ny;
                b.vx += imp * nx; b.vy += imp * ny;
                a.rotV += (Math.random() - 0.5) * 26;
                b.rotV += (Math.random() - 0.5) * 26;
              }
            }
          }
        }
        // 每次迭代后重新约束，防止碰撞分离把星星推出瓶壁
        for (i = 0; i < n; i++) applyBounds(activeStars[i], dt, REST, FRIC, G);
      }

      // 3) 静止化：速度低于阈值即停，避免微抖（阈值覆盖单帧重力增量）
      for (i = 0; i < n; i++) {
        var st = activeStars[i];
        if (Math.abs(st.vx) < 8) st.vx = 0;
        if (Math.abs(st.vy) < 12) st.vy = 0;
        if (Math.abs(st.rotV) < 0.5) st.rotV = 0;
      }
    }

    function renderPhysStars() {
      var n = activeStars.length;
      for (var i = 0; i < n; i++) {
        var s = activeStars[i];
        s.el.setAttribute('transform', 'translate(' + s.x + ',' + s.y + ') rotate(' + s.rot + ') scale(' + s.scale + ')');
      }
      var c = document.getElementById('starCount');
      var total = letters.length;
      if (c && +c.textContent !== total) c.textContent = total;
    }

    function startPhysics() {
      if (physRunning) return;
      physRunning = true;
      physLast = performance.now();
      function loop(now) {
        var dt = Math.min(0.033, (now - physLast) / 1000);
        physLast = now;
        physicsStep(dt);
        renderPhysStars();
        if (physRunning) physRaf = requestAnimationFrame(loop);
      }
      physRaf = requestAnimationFrame(loop);
    }

    function initPhysicsStars() {
      document.getElementById('bottleStars').innerHTML = '';
      activeStars = [];
      pendingStars = [];
      releaseAccum = 0;
      for (var i = 0; i < letters.length; i++) {
        pendingStars.push(makeStarData(i, false));
      }
      startPhysics();
    }

    // 写新信后：新星星直接从瓶口掉入（配合折纸动画）
    function addNewStar(idx) {
      var s = makeStarData(idx, true);
      activeStars.push(s);
      buildStarDom(s, activeStars.length - 1);
    }

    // 摇晃：给所有星星随机冲量，让它们在瓶内乱撞后重新堆好
    function shakeStars() {
      activeStars.forEach(function(s) {
        s.vx += (Math.random() - 0.5) * 720;
        s.vy -= 180 + Math.random() * 420;
        s.rotV += (Math.random() - 0.5) * 460;
      });
    }

    /* ===== Emotion Selector ===== */
    var selectedEmotion = null;

    /* ===== Emotion FX ===== */
    var fxLayer = null, fxTimer = null;
    function ensureFxLayer() { if (!fxLayer) fxLayer = document.getElementById('fxLayer'); return fxLayer; }
    function stopEmotionFx() {
      if (fxTimer) { clearTimeout(fxTimer); fxTimer = null; }
      var layer = ensureFxLayer();
      if (layer) { layer.className = 'fx-layer'; layer.innerHTML = ''; }
    }
    function playEmotionFx(label) {
      stopEmotionFx();
      var layer = ensureFxLayer(); if (!layer) return;
      var cls = '';
      if (label === '难过') { cls = 'fx-rain'; buildRain(layer); }
      else if (label === '开心') { cls = 'fx-sunshine'; buildSunshine(layer); }
      else if (label === '生气') { cls = 'fx-anger'; buildAnger(layer); }
      else if (label === '爱你') { cls = 'fx-hearts'; buildHearts(layer); }
      else return;
      layer.className = 'fx-layer ' + cls;
      fxTimer = setTimeout(stopEmotionFx, 3000);
    }
    function buildRain(layer) {
      var frag = document.createDocumentFragment();
      for (var i = 0; i < 38; i++) {
        var d = document.createElement('div'); d.className = 'raindrop';
        d.style.left = (Math.random()*100)+'%';
        d.style.height = (12+Math.random()*18)+'px';
        d.style.animationDuration = (0.6+Math.random()*0.5)+'s';
        d.style.animationDelay = (Math.random()*0.8)+'s';
        frag.appendChild(d);
      }
      layer.appendChild(frag);
    }
    function buildSunshine(layer) {
      var core = document.createElement('div'); core.className = 'sun-core';
      var smile = document.createElement('div'); smile.className = 'sun-smile';
      core.appendChild(smile);
      var ray = document.createElement('div'); ray.className = 'sun-ray';
      for (var i = 0; i < 8; i++) {
        var s = document.createElement('span');
        s.style.transform = 'rotate('+(i*45)+'deg) translateY(-34px)';
        ray.appendChild(s);
      }
      layer.appendChild(ray); layer.appendChild(core);
    }
    function buildAnger(layer) {
      var face = document.createElement('div'); face.className = 'anger-face';
      var head = document.createElement('div'); head.className = 'a-head'; face.appendChild(head);
      ['a-brow a-brow-l','a-brow a-brow-r','a-eye a-eye-l','a-eye a-eye-r','a-mouth'].forEach(function(c){
        var el = document.createElement('div'); el.className = c; face.appendChild(el);
      });
      layer.appendChild(face);
      ['','s2','s3'].forEach(function(c){
        var st = document.createElement('div'); st.className = 'anger-steam '+c; layer.appendChild(st);
      });
    }
    function buildHearts(layer) {
      var colors = ['#E91E63','#F06292','#EC407A','#F8BBD0','#F48FB1'];
      var frag = document.createDocumentFragment();
      for (var i = 0; i < 14; i++) {
        var h = document.createElement('div'); h.className = 'heart';
        var size = 14+Math.random()*16;
        var col = colors[Math.floor(Math.random()*colors.length)];
        h.style.left = (Math.random()*100)+'%';
        h.style.animationDuration = (2.5+Math.random()*1.5)+'s';
        h.style.animationDelay = (Math.random()*1)+'s';
        h.innerHTML = '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24"><path fill="'+col+'" d="M12 21s-7.5-4.7-10-9.3C0.7 8.4 2 5 5.2 5c1.9 0 3.1 1 3.8 2 0.7-1 1.9-2 3.8-2C16 5 17.3 8.4 16 11.7 13.5 16.3 12 21 12 21z"/></svg>';
        frag.appendChild(h);
      }
      layer.appendChild(frag);
    }

    function renderEmotionSelector() {
      var container = document.getElementById('emotionSelector');
      container.innerHTML = '';
      EMOTIONS.forEach(function(emo) {
        var btn = document.createElement('div');
        btn.className = 'emotion-btn';
        btn.style.setProperty('--emo-color', emo.color);
        btn.dataset.level = emo.level;
        btn.innerHTML = createStarSVG(emoToColors(emo), 26) + '<span class="emo-label">' + emo.label + '</span>';
        btn.addEventListener('click', function() {
          document.querySelectorAll('.emotion-btn').forEach(function(b) { b.classList.remove('selected'); });
          btn.classList.add('selected');
          selectedEmotion = emo;
          updateFoldBtn();
          playEmotionFx(emo.label);
        });
        container.appendChild(btn);
      });
    }
    function updateFoldBtn() {
      var text = document.getElementById('letterText').value.trim();
      var btn = document.getElementById('foldBtn');
      btn.disabled = !selectedEmotion || !text;
    }

    /* ===== Modal Control ===== */
    function openMenu() {
      document.getElementById('menuOverlay').classList.add('active');
    }
    function closeMenu() {
      document.getElementById('menuOverlay').classList.remove('active');
    }
    function openWriteModal() {
      closeMenu();
      selectedEmotion = null;
      document.getElementById('letterText').value = '';
      document.querySelectorAll('.emotion-btn').forEach(function(b) { b.classList.remove('selected'); });
      updateFoldBtn();
      var now = new Date();
      document.getElementById('writeDate').textContent = formatDate(now);
      document.getElementById('writeTime').textContent = formatTime(now);
      document.getElementById('writeModal').classList.add('active');
      setTimeout(function() { document.getElementById('letterText').focus(); }, 400);
    }
    function closeWriteModal() {
      stopEmotionFx();
      document.getElementById('writeModal').classList.remove('active');
    }
    function openViewModal() {
      closeMenu();
      // 先从云端拉取最新数据（能看到对方新写的信）
      syncFromCloud().then(function() {
        renderLettersList();
        initPhysicsStars();
        document.getElementById('viewModal').classList.add('active');
      });
    }
    function closeViewModal() {
      document.getElementById('viewModal').classList.remove('active');
    }

    /* ===== Letters List ===== */
    function renderLettersList() {
      var container = document.getElementById('lettersList');
      container.innerHTML = '';
      if (letters.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-icon">☆</div><p>瓶子里还没有星星</p><p>去写第一封信吧 ✦</p></div>';
        return;
      }
      var sorted = letters.slice().reverse();
      sorted.forEach(function(letter, idx) {
        var emo = emotionByLabel(letter.emotionLabel);
        var emoColor = emo ? emo.color : ((letter.starColors && letter.starColors.base) || '#F4D03F');
        var card = document.createElement('div');
        card.className = 'letter-card';
        card.style.setProperty('--emo-color', emoColor);
        card.style.animationDelay = (idx * 0.04) + 's';

        var hasResolution = letter.resolution && letter.resolution.trim();
        var resolutionHTML = '';
        if (hasResolution) {
          resolutionHTML =
            '<div class="card-resolution">' +
              '<div class="resolution-label">情绪是怎么消解的</div>' +
              '<div class="resolution-text">' + escapeHTML(letter.resolution) + '</div>' +
              '<div class="resolution-actions">' +
                '<button class="res-btn res-btn-edit" onclick="editResolution(' + letter.id + ', this)">编辑</button>' +
              '</div>' +
            '</div>';
        } else {
          resolutionHTML =
            '<div class="card-resolution">' +
              '<div class="resolution-label">情绪是怎么消解的</div>' +
              '<textarea class="resolution-input" placeholder="写下这个情绪后来是怎么消失的..." rows="2"></textarea>' +
              '<div class="resolution-actions">' +
                '<button class="res-btn res-btn-save" onclick="saveResolution(' + letter.id + ', this)">保存</button>' +
                '<button class="res-btn res-btn-cancel" onclick="cancelResolution(this)">取消</button>' +
              '</div>' +
            '</div>';
        }

        var authorName = letter.author || '';
        var authorHTML = authorName ? '<span class="card-author author-' + authorName + '">' + escapeHTML(authorName) + '</span>' : '';

        // 回复区域
        var replies = letter.replies || [];
        var repliesHTML = '<div class="card-replies">';
        replies.forEach(function(reply) {
          repliesHTML +=
            '<div class="reply-item reply-' + (reply.author || '') + '">' +
              '<div class="reply-author author-' + (reply.author || '') + '">' + escapeHTML(reply.author || '') + ' 回复</div>' +
              '<div class="reply-text">' + escapeHTML(reply.text) + '</div>' +
              '<div style="font-size:10px;color:#b0a090;margin-top:3px;">' + formatDateShort(reply.timestamp) + '</div>' +
            '</div>';
        });
        repliesHTML += '</div>';

        card.innerHTML =
          '<div class="card-top">' +
            '<div class="card-date-row">' +
              '<div class="card-star">' + createStarSVG(letter.starColors || generateStarColors(letter.id), 18) + '</div>' +
              '<span class="card-date">' + formatDateShort(letter.timestamp) + '</span>' +
              authorHTML +
            '</div>' +
            '<span class="card-emotion">' + escapeHTML(letter.emotionLabel || (emo ? emo.label : '')) + '</span>' +
          '</div>' +
          '<div class="card-content">' + escapeHTML(letter.content) + '</div>' +
          resolutionHTML +
          repliesHTML +
          '<button class="reply-toggle-btn" onclick="toggleReplyInput(' + letter.id + ', this)">回复</button>';
        container.appendChild(card);
      });
    }

    function saveResolution(letterId, btn) {
      var card = btn.closest('.letter-card');
      var textarea = card.querySelector('.resolution-input');
      var text = textarea.value.trim();
      if (!text) return;
      var letter = letters.find(function(l) { return l.id === letterId; });
      if (letter) {
        letter.resolution = text;
        saveLocal();
        cloudPush();
        renderLettersList();
      }
    }

    function cancelResolution(btn) {
      var card = btn.closest('.letter-card');
      var textarea = card.querySelector('.resolution-input');
      textarea.value = '';
    }

    function editResolution(letterId, btn) {
      var card = btn.closest('.letter-card');
      var letter = letters.find(function(l) { return l.id === letterId; });
      if (!letter) return;
      var resDiv = card.querySelector('.card-resolution');
      resDiv.innerHTML =
        '<div class="resolution-label">情绪是怎么消解的</div>' +
        '<textarea class="resolution-input" rows="2">' + escapeHTML(letter.resolution || '') + '</textarea>' +
        '<div class="resolution-actions">' +
          '<button class="res-btn res-btn-save" onclick="saveResolution(' + letter.id + ', this)">保存</button>' +
          '<button class="res-btn res-btn-cancel" onclick="renderLettersList()">取消</button>' +
        '</div>';
    }

    /* ===== Reply Functions ===== */
    function toggleReplyInput(letterId, btn) {
      var card = btn.closest('.letter-card');
      var existing = card.querySelector('.reply-input-row');
      if (existing) {
        // 已展开则收起
        existing.remove();
        btn.textContent = '回复';
        return;
      }
      btn.textContent = '收起';
      var row = document.createElement('div');
      row.className = 'reply-input-row';
      row.innerHTML =
        '<textarea class="reply-input" placeholder="写下你的回复..." rows="1"></textarea>' +
        '<button class="reply-send-btn" onclick="sendReply(' + letterId + ', this)">发送</button>';
      card.appendChild(row);
      row.querySelector('.reply-input').focus();
    }
    function sendReply(letterId, btn) {
      var card = btn.closest('.letter-card');
      var textarea = card.querySelector('.reply-input');
      var text = textarea.value.trim();
      if (!text) return;
      var letter = letters.find(function(l) { return l.id === letterId; });
      if (!letter) return;
      if (!letter.replies) letter.replies = [];
      letter.replies.push({
        author: myName || '',
        text: text,
        timestamp: Date.now()
      });
      saveLocal();
      cloudPush();
      // 更新通知基准值
      lastReplyCount = countTotalReplies();
      renderLettersList();
    }
    function escapeHTML(str) {
      var div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // 按标签文字反查情绪（用于信件卡片，兼容旧数据）
    function emotionByLabel(label) {
      if (!label) return null;
      for (var i = 0; i < EMOTIONS.length; i++) {
        if (EMOTIONS[i].label === label) return EMOTIONS[i];
      }
      return null;
    }

    // 旧数据迁移：给没有 starColors 的信件补上基于 id 的稳定随机色
    function migrateLetters() {
      var changed = false;
      letters.forEach(function(l) {
        if (!l.starColors) {
          l.starColors = generateStarColors(l.id || Math.floor(Math.random() * 1e9));
          changed = true;
        }
      });
      if (changed) { saveLocal(); cloudPush(); }
    }

    /* ===== Fold Animation & Save ===== */
    function foldAndSave() {
      var text = document.getElementById('letterText').value.trim();
      if (!selectedEmotion || !text) return;

      // Save letter（星星颜色全随机，与情绪无关）
      var now = new Date();
      var starColors = generateStarColors();
      var letter = {
        id: Date.now(),
        emotionLevel: selectedEmotion.level,
        emotionLabel: selectedEmotion.label,
        starColors: starColors,
        content: text,
        timestamp: now.getTime(),
        resolution: '',
        author: myName || ''
      };
      letters.push(letter);
      saveLocal();
      cloudPush();
      // 更新通知基准值，避免自己写的信触发通知
      lastLetterCount = letters.length;
      lastReplyCount = countTotalReplies();

      // Close write modal
      closeWriteModal();

      // Play fold animation
      var overlay = document.getElementById('foldOverlay');
      var paper = document.getElementById('paperFold');
      var star = document.getElementById('starFold');

      star.innerHTML = createStarSVG(starColors, 56);
      overlay.classList.add('active');

      // Reset states
      paper.classList.remove('folding');
      star.classList.remove('appearing', 'dropping');
      paper.style.opacity = '0';
      star.style.opacity = '0';
      star.style.transform = 'scale(0)';

      // Force reflow
      void paper.offsetWidth;

      // Phase 1: Paper folds
      setTimeout(function() {
        paper.style.opacity = '1';
        paper.classList.add('folding');
      }, 200);

      // Phase 2: Star appears (paper fading out)
      setTimeout(function() {
        paper.style.opacity = '0';
        star.classList.add('appearing');
      }, 750);

      // Phase 3: Star drops
      setTimeout(function() {
        star.classList.remove('appearing');
        star.classList.add('dropping');
      }, 1350);

      // Phase 4: Bottle jiggle & new star drops into the bottle
      setTimeout(function() {
        overlay.classList.remove('active');
        var bottle = document.getElementById('bottle');
        bottle.classList.add('jiggle');
        addNewStar(letters.length - 1);
        setTimeout(function() { bottle.classList.remove('jiggle'); }, 400);
      }, 2150);
    }

    /* ===== Shake Detection & Star Shake ===== */
    var isShaking = false;
    function shakeBottle() {
      if (isShaking) return;
      isShaking = true;

      var bottle = document.getElementById('bottle');

      // Bottle shakes strongly
      bottle.classList.remove('big-shake');
      void bottle.offsetWidth;
      bottle.classList.add('big-shake');

      // Physics: give every star a random impulse so they tumble and re-pile
      shakeStars();

      setTimeout(function() {
        bottle.classList.remove('big-shake');
        isShaking = false;
      }, 1000);
    }

    var lastShakeCheck = 0;
    var lastAcc = { x: 0, y: 0, z: 0 };
    function onDeviceMotion(e) {
      var acc = e.accelerationIncludingGravity;
      if (!acc) return;
      var now = Date.now();
      if (now - lastShakeCheck < 150) return;
      lastShakeCheck = now;

      var dx = Math.abs(acc.x - lastAcc.x);
      var dy = Math.abs(acc.y - lastAcc.y);
      var dz = Math.abs(acc.z - lastAcc.z);
      lastAcc.x = acc.x; lastAcc.y = acc.y; lastAcc.z = acc.z;

      if (dx + dy + dz > 30) {
        shakeBottle();
      }
    }

    function initShakeDetection() {
      var isMobile = /Android|iPhone|iPad|iPod|Mobile|webOS|BlackBerry/i.test(navigator.userAgent);
      if (isMobile) {
        document.body.classList.remove('is-desktop');
        var hint = document.getElementById('hint');
        if (hint) hint.textContent = '轻触瓶身 · 摇晃手机，星星会晃荡';
      } else {
        document.body.classList.add('is-desktop');
      }

      if (window.DeviceMotionEvent) {
        var req = DeviceMotionEvent.requestPermission;
        if (typeof req === 'function') {
          // iOS 13+: ask permission on first tap
          var bottle = document.getElementById('bottle');
          function askOnce() {
            req.call(DeviceMotionEvent).then(function(state) {
              if (state === 'granted') {
                window.addEventListener('devicemotion', onDeviceMotion);
              }
            }).catch(function() {});
            bottle.removeEventListener('click', askOnce);
          }
          bottle.addEventListener('click', askOnce);
        } else {
          window.addEventListener('devicemotion', onDeviceMotion);
        }
      }

      var shakeBtn = document.getElementById('shakeBtn');
      if (shakeBtn) shakeBtn.addEventListener('click', shakeBottle);

      var switchPairBtn = document.getElementById('switchPairBtn');
      if (switchPairBtn) {
        switchPairBtn.style.display = 'inline-block';
        switchPairBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          if (window.switchPairCode) window.switchPairCode();
        });
      }
    }

    /* ===== Event Listeners ===== */
    document.getElementById('bottle').addEventListener('click', openMenu);
    document.getElementById('writeBtn').addEventListener('click', openWriteModal);
    document.getElementById('viewBtn').addEventListener('click', openViewModal);
    document.getElementById('closeWrite').addEventListener('click', closeWriteModal);
    document.getElementById('closeView').addEventListener('click', closeViewModal);
    document.getElementById('foldBtn').addEventListener('click', foldAndSave);
    document.getElementById('letterText').addEventListener('input', updateFoldBtn);

    // Click outside to close
    document.getElementById('menuOverlay').addEventListener('click', function(e) {
      if (e.target === this) closeMenu();
    });
    document.getElementById('writeModal').addEventListener('click', function(e) {
      if (e.target === this) closeWriteModal();
    });
    document.getElementById('viewModal').addEventListener('click', function(e) {
      if (e.target === this) closeViewModal();
    });

    // Prevent body scroll on touch
    document.addEventListener('touchmove', function(e) {
      if (e.target.tagName !== 'TEXTAREA' && !e.target.closest('.letters-list') && !e.target.closest('.card-content')) {
        e.preventDefault();
      }
    }, { passive: false });

    /* ===== Service Worker Registration (PWA) ===== */
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js').catch(function() {});
      });
    }

    /* ===== Init ===== */
    createBgStars();
    updateDateTime();
    setInterval(updateDateTime, 1000);
    renderEmotionSelector();
    initShakeDetection();

    /* ===== Pair Code Flow ===== */
    function showPairModal() {
      document.getElementById('pairOverlay').classList.add('active');
      setTimeout(function() { document.getElementById('pairInput').focus(); }, 400);
    }
    function hidePairModal() {
      document.getElementById('pairOverlay').classList.remove('active');
    }
    function enterBottle() {
      // 从云端拉取数据后初始化瓶子里的星星
      syncFromCloud().then(function() {
        migrateLetters();
        initPhysicsStars();
        startNotifyPolling();
      });
    }

    /* ===== Notification Polling ===== */
    var lastLetterCount = 0;
    var lastReplyCount = 0;  // 所有信件回复总数
    var notifyPollTimer = null;

    function countTotalReplies() {
      var total = 0;
      letters.forEach(function(l) { total += (l.replies ? l.replies.length : 0); });
      return total;
    }

    function startNotifyPolling() {
      // 初始化基准值
      lastLetterCount = letters.length;
      lastReplyCount = countTotalReplies();
      if (notifyPollTimer) clearInterval(notifyPollTimer);
      // 每 15 秒轮询一次
      notifyPollTimer = setInterval(checkNewMessages, 15000);
    }

    function checkNewMessages() {
      if (!pairCode) return;
      cloudFetch().then(function(remote) {
        if (!remote || !Array.isArray(remote)) return;
        var newLetterCount = remote.length;
        var newReplyCount = 0;
        remote.forEach(function(l) { newReplyCount += (l.replies ? l.replies.length : 0); });

        var newLetters = newLetterCount - lastLetterCount;
        var newReplies = newReplyCount - lastReplyCount;

        if (newLetters > 0 || newReplies > 0) {
          // 找出对方发的新内容
          var messages = [];
          if (newLetters > 0) {
            // 检查新增的信件中有没有对方发的
            var recentLetters = remote.slice(-newLetters);
            recentLetters.forEach(function(l) {
              if (l.author && l.author !== myName) {
                messages.push({ type: 'letter', author: l.author, preview: (l.content || '').substring(0, 30) });
              }
            });
          }
          if (newReplies > 0) {
            // 检查新增的回复中有没有对方发的
            // 简化：如果对方有新回复，提示一下
            messages.push({ type: 'reply', author: 'TA' });
          }

          // 过滤掉自己发的（自己写的不提示）
          var otherMessages = messages.filter(function(m) { return m.author !== myName; });
          if (otherMessages.length > 0) {
            showNotifyToast(otherMessages);
          }

          // 更新本地数据
          letters = remote;
          saveLocal();
          initPhysicsStars();
          lastLetterCount = newLetterCount;
          lastReplyCount = newReplyCount;
        }
      });
    }

    function showNotifyToast(messages) {
      var toast = document.getElementById('notifyToast');
      var html = '';
      messages.forEach(function(m) {
        var authorClass = m.author === 'R' ? 'author-R' : (m.author === 'M' ? 'author-M' : '');
        if (m.type === 'letter') {
          html += '<span class="notify-author ' + authorClass + '">' + escapeHTML(m.author) + '</span> 给你写了一封信';
          if (m.preview) html += '：<span style="opacity:0.8;">"' + escapeHTML(m.preview) + '..."</span>';
        } else {
          html += '<span class="notify-author">TA</span> 回复了你的信件';
        }
        html += '<br>';
      });
      toast.innerHTML = html;
      toast.classList.add('show');
      setTimeout(function() { toast.classList.remove('show'); }, 5000);
    }
    // 身份选择按钮事件
    document.querySelectorAll('.who-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.who-btn').forEach(function(b) { b.classList.remove('selected'); });
        btn.classList.add('selected');
        selectedWho = btn.dataset.who;
      });
      // 如果已有保存的身份，回显选中状态
      if (myName && btn.dataset.who === myName) btn.classList.add('selected');
    });
    document.getElementById('pairSubmit').addEventListener('click', function() {
      var code = document.getElementById('pairInput').value.trim();
      if (!code) return;
      if (!selectedWho) {
        // 没选身份时给个提示
        var hint = document.querySelector('.who-label');
        if (hint) { hint.style.color = '#E74C3C'; hint.textContent = '请先选择你是 R 还是 M →'; }
        return;
      }
      pairCode = code;
      myName = selectedWho;
      try { localStorage.setItem(PAIR_KEY, code); } catch(e) {}
      try { localStorage.setItem(WHO_KEY, myName); } catch(e) {}
      // 切换配对码时清空本地缓存，避免不同房间数据混淆
      try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
      letters = [];
      hidePairModal();
      enterBottle();
    });
    document.getElementById('pairInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') document.getElementById('pairSubmit').click();
    });

    if (pairCode && myName) {
      enterBottle();
    } else {
      showPairModal();
    }

    // 全局暴露切换配对码的入口（供调试和切换用）
    window.switchPairCode = function() {
      if (notifyPollTimer) { clearInterval(notifyPollTimer); notifyPollTimer = null; }
      try { localStorage.removeItem(PAIR_KEY); } catch(e) {}
      try { localStorage.removeItem(WHO_KEY); } catch(e) {}
      try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
      pairCode = '';
      myName = '';
      selectedWho = '';
      letters = [];
      // 重置身份选择按钮
      document.querySelectorAll('.who-btn').forEach(function(b) { b.classList.remove('selected'); });
      // 重置身份提示文字
      var hint = document.querySelector('.who-label');
      if (hint) { hint.style.color = ''; hint.textContent = '我是'; }
      initPhysicsStars();
      showPairModal();
    };
  </script>
</body>
</html>
